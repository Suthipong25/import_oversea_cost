services:
  postgres:
    image: postgres:16-alpine
    container_name: perkin-freightrate-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: perkin_freightrate
    ports:
      - "5432:5432"
    volumes:
      - perkin_pgdata:/var/lib/postgresql/data

volumes:
  perkin_pgdata:
